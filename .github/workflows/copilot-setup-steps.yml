name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
# Last updated: 2026-01-20 - Added credentials verification step
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-24.04

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ccache \
            clang-format \
            debhelper-compat \
            qt6-base-private-dev \
            qt6-base-dev \
            libqt6sql6-sqlite \
            qtkeychain-qt6-dev \
            libsecret-1-dev

      - name: Set up ccache
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          ccache --version
          mkdir -p $CCACHE_DIR
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-debian-noble-X86-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-debian-noble-X86-${{ github.ref }}
            ccache-debian-noble-X86-refs/heads/main

      - name: Setup test credentials
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ID_TOKEN: ${{ secrets.ID_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          EXPIRES_IN: ${{ vars.EXPIRES_IN }}
          RECEIVED_AT: ${{ vars.RECEIVED_AT }}
          SCOPE: ${{ vars.SCOPE }}
          TOKEN_TYPE: ${{ vars.TOKEN_TYPE }}
        run: |
          chmod +x .github/scripts/setup-test-credentials.sh
          .github/scripts/setup-test-credentials.sh

      - name: Check credentials files
        run: |
          echo "=== Checking TradeStationTokens.ini ==="
          cat ~/.config/L2Trader/TradeStationTokens.ini
          echo ""
          echo "=== Checking SecureStorage.ini ==="
          cat ~/.config/L2Trader/SecureStorage.ini
