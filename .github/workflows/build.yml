name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rpi-tests:
        description: 'Run RPI tests on self-hosted ARM64 runner'
        required: false
        default: false
        type: boolean

jobs:
  check-formatting:
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
    - uses: actions/checkout@v4

    - name: Install uncrustify
      run: |
        sudo apt-get update
        sudo apt-get install -y uncrustify

    - name: Check code formatting
      run: |
        echo "Checking code formatting with Uncrustify..."
        FAILED_FILES=()
        
        # Find all C++ source and header files
        FILES=$(find Src Tests -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cxx" \))
        
        for file in $FILES; do
          if ! uncrustify -c .uncrustify.cfg --check "$file" > /dev/null 2>&1; then
            FAILED_FILES+=("$file")
            echo "❌ $file needs formatting"
          fi
        done
        
        if [ ${#FAILED_FILES[@]} -ne 0 ]; then
          echo ""
          echo "================================================"
          echo "Code formatting check FAILED"
          echo "================================================"
          echo ""
          echo "The following files need to be formatted:"
          for file in "${FAILED_FILES[@]}"; do
            echo "  - $file"
          done
          echo ""
          echo "To fix formatting issues, run:"
          echo "  uncrustify -c .uncrustify.cfg --no-backup --replace <file>"
          echo ""
          echo "Or format all files:"
          echo "  find Src Tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -exec uncrustify -c .uncrustify.cfg --no-backup --replace {} \;"
          exit 1
        fi
        
        echo ""
        echo "✅ All files are properly formatted!"

  build-main:
    runs-on: [self-hosted, Linux, X64]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
    - uses: actions/checkout@v4

    - name: Set number of parallel jobs
      run: echo "PARALLEL_JOBS=-j$(nproc)" >> $GITHUB_ENV

    - name: Show CMake version
      run: cmake --version
    
    - name: Create build directory
      run: mkdir -p build

    - name: Configure with CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_GUI=ON -DBUILD_TESTS=ON

    - name: Build all targets
      run: cmake --build build $PARALLEL_JOBS

  build-with-ubsan:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
    - uses: actions/checkout@v4

    - name: Set number of parallel jobs
      run: echo "PARALLEL_JOBS=-j$(nproc)" >> $GITHUB_ENV

    - name: Show CMake version
      run: cmake --version
    
    - name: Create build directory
      run: mkdir -p build-ubsan

    - name: Configure with CMake (UBSan enabled)
      run: cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_GUI=ON -DBUILD_TESTS=ON -DENABLE_UBSAN=ON

    - name: Build all targets with UBSan
      run: cmake --build build-ubsan $PARALLEL_JOBS

  run-barcache-test-ubsan:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-with-ubsan]
    permissions: {}

    steps:
    - name: Run BarCache unit test with UBSan
      run: ./build-ubsan/Tests/test_barcache --stock-csv=Example_Config/nasdaq_screener.csv

  run-tsclient-test-ubsan:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-with-ubsan]
    permissions: {}

    steps:
    - name: Run TSClient unit test with UBSan
      run: ./build-ubsan/Tests/test_tradestationclient

  run-runupdetector-test-ubsan:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-with-ubsan]
    permissions: {}

    steps:
    - name: Run RunUpDetector unit test with UBSan
      run: ./build-ubsan/Tests/test_RunUpDetector

  run-recorder-integration-test-ubsan:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-with-ubsan]
    permissions: {}

    steps:
    - name: Run Recorder integration test with UBSan
      run: |
        rm -f $HOME/.local/state/Recorder/logs/Recorder_*.log.ansi
        ./build-ubsan/Tests/test_recorder_integration

    - name: Display Recorder log
      if: always()
      run: |
        LOG_FILE=$(ls -t $HOME/.local/state/Recorder/logs/Recorder_*.log.ansi | head -1)
        echo "Log file: $LOG_FILE"
        if [ -f "$LOG_FILE" ]; then
          echo "=== Recorder Log ==="
          cat "$LOG_FILE"
        else
          echo "No log file found"
        fi

  run-barcache-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-main]

    steps:
    - name: Run BarCache unit test
      run: ./build/Tests/test_barcache --stock-csv=Example_Config/nasdaq_screener.csv

  run-tsclient-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-main]

    steps:
    - name: Run TSClient unit test
      run: ./build/Tests/test_tradestationclient

  run-runupdetector-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-main]

    steps:
    - name: Run RunUpDetector unit test
      run: ./build/Tests/test_RunUpDetector

  run-recorder-integration-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-main]

    steps:
    - name: Run Recorder integration test
      run: |
        rm $HOME/.local/state/Recorder/logs/Recorder_*.log.ansi
        ./build/Tests/test_recorder_integration

    - name: Display Recorder log
      if: always()
      run: |
