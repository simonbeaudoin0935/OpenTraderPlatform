name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'laptop'
        type: choice
        options:
        - laptop
        - raspberrypi

jobs:
  build-main:
    runs-on: [self-hosted, Linux, "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' && 'ARM64' || 'X64' }}"]

    steps:
    - uses: actions/checkout@v4

    - name: Set Qt path
      run: |
        if [ "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' || github.event_name != 'workflow_dispatch' }}" = "false" ]; then
          echo "QMAKE=/home/simon/Qt/6.4.2/gcc_64/bin/qmake" >> $GITHUB_ENV
          echo "MAKE_JOBS=-j1" >> $GITHUB_ENV
        else
          echo "QMAKE=/home/simon/Qt/6.8.3/gcc_64/bin/qmake" >> $GITHUB_ENV
          echo "MAKE_JOBS=-j$(nproc)" >> $GITHUB_ENV
        fi

    - name: Create build directory
      run: mkdir -p build

    - name: Run qmake
      run: $QMAKE L2Trader.pro -o build/Makefile -spec linux-g++ CONFIG+=debug CONFIG+=qml_debug

    - name: Run make
      run: make $MAKE_JOBS -C build

  build-recorder:
    needs: build-main
    runs-on: [self-hosted, Linux, "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' && 'ARM64' || 'X64' }}"]

    steps:
    - uses: actions/checkout@v4

    - name: Set Qt path
      run: |
        if [ "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' || github.event_name != 'workflow_dispatch' }}" = "false" ]; then
          echo "QMAKE=/home/simon/Qt/6.4.2/gcc_64/bin/qmake" >> $GITHUB_ENV
          echo "MAKE_JOBS=-j1" >> $GITHUB_ENV
        else
          echo "QMAKE=/home/simon/Qt/6.8.3/gcc_64/bin/qmake" >> $GITHUB_ENV
          echo "MAKE_JOBS=-j$(nproc)" >> $GITHUB_ENV
        fi

    - name: Create build directory
      run: mkdir -p build

    - name: Run qmake
      run: $QMAKE Recorder.pro -o build/Makefile -spec linux-g++ CONFIG+=debug CONFIG+=qml_debug

    - name: Run make
      run: make $MAKE_JOBS -C build

  build-tests:
    runs-on: [self-hosted, Linux, "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' && 'ARM64' || 'X64' }}"]
    needs: build-recorder

    steps:
    - uses: actions/checkout@v4

    - name: Set Qt path
      run: |
        if [ "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' || github.event_name != 'workflow_dispatch' }}" = "false" ]; then
          echo "QMAKE=qmake" >> $GITHUB_ENV
          echo "MAKE_JOBS=-j1" >> $GITHUB_ENV
        else
          echo "QMAKE=/home/simon/Qt/6.8.3/gcc_64/bin/qmake" >> $GITHUB_ENV
          echo "MAKE_JOBS=-j$(nproc)" >> $GITHUB_ENV
        fi

    - name: Create build directory for tests
      run: mkdir -p build/Tests

    - name: Run qmake for tests
      run: $QMAKE Tests.pro -o build/Tests/Makefile -spec linux-g++ CONFIG+=debug CONFIG+=qml_debug

    - name: Run make for tests
      run: make $MAKE_JOBS -C build/Tests

  run-barcache-test:
    runs-on: [self-hosted, Linux, "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' && 'ARM64' || 'X64' }}"]
    needs: build-tests

    steps:
    - name: Run BarCache unit test
      run: ./build/Tests/Tests/BarCacheUnit/test_barcache --stock-csv=Example_Config/nasdaq_screener.csv

  run-fmpclient-test:
    runs-on: [self-hosted, Linux, "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' && 'ARM64' || 'X64' }}"]
    needs: build-tests

    steps:
    - name: Run FMPClient unit test
      run: ./build/Tests/Tests/FMPClientUnit/test_fmpclient --stock-csv=Example_Config/nasdaq_screener.csv

  run-tsclient-test:
    runs-on: [self-hosted, Linux, "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' && 'ARM64' || 'X64' }}"]
    needs: build-tests

    steps:
    - name: Run TSClient unit test
      run: ./build/Tests/Tests/TSClientUnit/test_tradestationclient --stock-csv=Example_Config/nasdaq_screener.csv

  run-runupdetector-test:
    runs-on: [self-hosted, Linux, "${{ github.event_name == 'workflow_dispatch' && inputs.target == 'raspberrypi' && 'ARM64' || 'X64' }}"]
    needs: build-tests

    steps:
    - name: Run RunUpDetector unit test
      run: ./build/Tests/Tests/RunUpDetectorUnit/test_RunUpDetector --stock-csv=Example_Config/nasdaq_screener.csv