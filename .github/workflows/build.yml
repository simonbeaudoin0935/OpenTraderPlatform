  build-debian-package:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: read

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/${{ vars.USERNAME }}/l2trader-builder:noble
      credentials:
        username: ${{ vars.USERNAME }}
        password: ${{secrets.TOKEN_GHCR}}

    steps:
    - uses: actions/checkout@v4

    - name: Set up ccache
      run: |
        export CCACHE_DIR=$HOME/.cache/ccache
        echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
        ccache --version
        mkdir -p $CCACHE_DIR
        ccache --set-config=max_size=500M
        ccache --set-config=compression=true
        ccache --set-config=compression_level=6
        ccache --zero-stats

    - name: Cache ccache directory
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-debian-noble-X86-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-debian-noble-X86-${{ github.ref }}
          ccache-debian-noble-X86-refs/heads/main

    - name: Build Debian package
      run: |
        cmake --version
        git config --global --add safe.directory /__w/L2Trader/L2Trader
        export GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
        export GIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        export GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
        echo "Building with version: $GIT_TAG ~ $GIT_BRANCH@$GIT_HASH"
        dpkg-buildpackage -us -uc -b

    - name: Show ccache statistics
      run: ccache --show-stats

    - name: Prepare artifacts directory
      run: |
        mkdir -p artifacts
        cp ../*.deb artifacts/

    - name: List generated packages
      run: ls -lh ../*.deb

    - name: Upload Debian packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages-X64
        path: artifacts/*.deb
