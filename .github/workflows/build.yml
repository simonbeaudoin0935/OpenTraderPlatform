name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rpi-tests:
        description: 'Run RPI tests on self-hosted ARM64 runner'
        required: false
        default: false
        type: boolean

jobs:
  build-main:
    runs-on: [self-hosted, Linux, X64]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
    - uses: actions/checkout@v4

    - name: Set number of parallel jobs
      run: echo "PARALLEL_JOBS=-j$(nproc)" >> $GITHUB_ENV

    - name: Show CMake version
      run: cmake --version
    
    - name: Create build directory
      run: mkdir -p build

    - name: Configure with CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_GUI=ON -DBUILD_TESTS=ON

    - name: Build all targets
      run: cmake --build build $PARALLEL_JOBS

  run-barcache-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-main]

    steps:
    - name: Run BarCache unit test
      run: ./build/Tests/test_barcache --stock-csv=Example_Config/nasdaq_screener.csv

#  run-fmpclient-test:
    #We are going to dump FMP in the future
#    if: false
#    runs-on: [self-hosted, Linux, X64]
#    needs: [build-main]

#    steps:
#    - name: Run FMPClient unit test
#      run: ./build/Tests/Tests/FMPClientUnit/test_fmpclient

  run-tsclient-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-main]

    steps:
    - name: Run TSClient unit test
      run: ./build/Tests/test_tradestationclient

  run-runupdetector-test:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-main]

    steps:
    - name: Run RunUpDetector unit test
      run: ./build/Tests/test_RunUpDetector

  build-debian-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/${{ vars.USERNAME }}/l2trader-builder:noble
      credentials:
        username: ${{ vars.USERNAME }}
        password: ${{secrets.TOKEN_GHCR}}

    steps:
    - uses: actions/checkout@v4

    - name: Set up ccache
      run: |
        ccache --version
        mkdir -p ~/.cache/ccache
        ccache --set-config=max_size=500M
        ccache --set-config=compression=true
        ccache --set-config=compression_level=6
        ccache --zero-stats

    - name: Cache ccache directory
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-debian-noble-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.sha }}
        restore-keys: |
          ccache-debian-noble-main
          ccache-debian-noble-
        save-always: true

    - name: Build Debian package
      run: |
        cmake --version
        git config --global --add safe.directory /__w/L2Trader/L2Trader
        dpkg-buildpackage -us -uc -b

    - name: Show ccache statistics
      run: ccache --show-stats

    - name: Prepare artifacts directory
      run: |
        mkdir -p artifacts
        cp ../*.deb artifacts/

    - name: List generated packages
      run: ls -lh ../*.deb

    - name: Upload Debian packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages-X64
        path: artifacts/*.deb

  build-debian-package-rpi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/${{ vars.USERNAME }}/l2trader-builder:rpi-bookworm
      credentials:
        username: ${{ vars.USERNAME }}
        password: ${{secrets.TOKEN_GHCR}}

    steps:
    - uses: actions/checkout@v4

    - name: Set up ccache
      run: |
        ccache --version
        mkdir -p ~/.cache/ccache
        ccache --set-config=max_size=500M
        ccache --set-config=compression=true
        ccache --set-config=compression_level=6
        ccache --zero-stats

    - name: Cache ccache directory
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-debian-bookworm-arm64-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.sha }}
        restore-keys: |
          ccache-debian-bookworm-arm64-main
          ccache-debian-bookworm-arm64-
        save-always: true

    - name: Build Debian package for RPI
      run: |
        cmake --version
        git config --global --add safe.directory /__w/L2Trader/L2Trader
        dpkg-buildpackage -us -uc -b -aarm64 -Pcross

    - name: Show ccache statistics
      run: ccache --show-stats

    - name: Prepare artifacts directory
      run: |
        mkdir -p artifacts
        cp ../*.deb artifacts/

    - name: List generated packages
      run: ls -lh ../*.deb

    - name: Upload Debian packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages-RPI
        path: artifacts/*.deb

  run-barcache-test-debian:
    runs-on: ubuntu-24.04
    needs: build-debian-package
    permissions:
      contents: read
      actions: read

    container:
      image: ghcr.io/${{ vars.USERNAME }}/l2trader-builder:noble
      credentials:
        username: ${{ vars.USERNAME }}
        password: ${{secrets.TOKEN_GHCR}}

    steps:
    - uses: actions/checkout@v4

    - name: Download Debian package artifacts
      uses: actions/download-artifact@v4
      with:
        name: debian-packages-X64
        path: ./packages

    - name: Install packages
      run: |
        apt-get update
        apt-get install -y ./packages/l2trader_*.deb ./packages/l2trader-tests_*.deb

    - name: Setup test credentials
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        ID_TOKEN: ${{ secrets.ID_TOKEN }}
        REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        EXPIRES_IN: ${{ vars.EXPIRES_IN }}
        RECEIVED_AT: ${{ vars.RECEIVED_AT }}
        SCOPE: ${{ vars.SCOPE }}
        TOKEN_TYPE: ${{ vars.TOKEN_TYPE }}
      run: |
        chmod +x .github/scripts/setup-test-credentials.sh
        .github/scripts/setup-test-credentials.sh

    - name: Run BarCache unit test
      run: /usr/lib/l2trader/tests/test_barcache

  run-tsclient-test-debian:
