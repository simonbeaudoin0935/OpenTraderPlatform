          EOF

      - name: Run ASan test with Xvfb
        run: |
          # Configure ASan environment
          export ASAN_OPTIONS="log_path=.sanitizers/asan/asan-report.txt:halt_on_error=0:detect_leaks=1:suppressions=.sanitizers/asan/asan.supp"
          
          # Start Xvfb on display :99
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          
