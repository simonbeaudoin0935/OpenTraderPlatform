name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/${{ vars.USERNAME }}/l2trader-builder:noble
      credentials:
        username: ${{ vars.USERNAME }}
        password: ${{secrets.TOKEN_GHCR}}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{github.head_ref}}

      # Check the formatting first as to not waste resources building if the code is not properly formatted.
      - name: clang-format
        uses: ./.github/actions/clang-format

      - name: Set up ccache
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          ccache --version
          mkdir -p $CCACHE_DIR
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-debian-noble-X86-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-debian-noble-X86-${{ github.ref }}
            ccache-debian-noble-X86-refs/heads/main

      - name: Configure GUI version with CMake
        run: |
          cmake --version
          mkdir -p build/GUI
          cmake -S . -B build/GUI -DCMAKE_BUILD_TYPE=Debug -DENABLE_GUI=ON -DBUILD_TESTS=OFF -DENABLE_UBSAN=OFF -DENABLE_ASAN=OFF

      - name: Configure TUI with CMake
        if: false
        run: |
          cmake --version
          mkdir -p build/TUI
          cmake -S . -B build/TUI -DCMAKE_BUILD_TYPE=Debug -DENABLE_GUI=OFF -DBUILD_TESTS=OFF -DENABLE_UBSAN=OFF -DENABLE_ASAN=OFF

      - name: Build TUI targets
        if: false
        run: cmake --build build/TUI -j$(nproc)

      - name: Build GUI targets
        run: cmake --build build/GUI -j$(nproc)

      - name: Upload GUI executable and libraries artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: l2trader-gui-${{ github.sha }}
          path: |
            build/GUI/Src/L2Trader
            build/GUI/Src/*.so
            build/GUI/lib/
          retention-days: 1

  test-gui:
    runs-on: ubuntu-24.04
    needs: build-debian-package
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    
    permissions:
      contents: read
      actions: read
    
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/${{ vars.USERNAME }}/l2trader-builder:noble
      credentials:
        username: ${{ vars.USERNAME }}
        password: ${{secrets.TOKEN_GHCR}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{github.head_ref}}

      - name: Download Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages-X64
          path: ./packages

      - name: Install packages
        run: |
          apt-get update
          apt-get install -y ./packages/l2trader_*.deb

      - name: Setup test credentials
        run: |
          chmod +x .github/scripts/setup-test-credentials.sh
          .github/scripts/setup-test-credentials.sh \
            "${{ secrets.ACCESS_TOKEN }}" \
            "${{ secrets.CLIENT_ID }}" \
            "${{ secrets.CLIENT_SECRET }}" \
            "${{ secrets.ID_TOKEN }}" \
            "${{ secrets.REFRESH_TOKEN }}" \
            "${{ vars.EXPIRES_IN }}" \
            "${{ vars.RECEIVED_AT }}" \
            "${{ vars.SCOPE }}" \
            "${{ vars.TOKEN_TYPE }}"

      - name: Print config files
        run: find ~/.config/L2Trader -type f -exec cat {} \;

      - name: Set default stock in AppState.ini
        run: |
          cat > ~/.config/L2Trader/AppState.ini << EOF
          [UI]
          LastDisplayedStock=TSLA
          EOF

      - name: Run GUI test with Xvfb
        run: |
          # Start Xvfb on display :99
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          
          # Wait for Xvfb to be ready
          sleep 2
          
          # Verify display is available
          xdpyinfo -display :99 > /dev/null 2>&1 || { 
            echo "Display :99 not available"
            kill $XVFB_PID 2>/dev/null || true
            exit 1
          }
          
          # Start the GUI application in background
          l2trader &
          APP_PID=$!
          
          # Wait for application to start
          sleep 5
          
          # Find the window and send Ctrl+Q
          WINDOW_ID=$(xdotool search --sync --onlyvisible --class "L2Trader" 2>/dev/null | head -1)
          
          if [ -n "$WINDOW_ID" ]; then
            echo "Found window ID: $WINDOW_ID"
            
            # Take a screenshot before sending Ctrl+Q
            mkdir -p screenshots
            import -window root screenshots/gui-test-before-quit.png
            echo "Screenshot saved to screenshots/gui-test-before-quit.png"
            
            # Send Ctrl+Q directly to the window (no activation needed in Xvfb)
            xdotool key --window "$WINDOW_ID" ctrl+q
            
            # Wait for application to exit (with timeout)
            TIMEOUT=10
            ELAPSED=0
            while kill -0 $APP_PID 2>/dev/null && [ $ELAPSED -lt $TIMEOUT ]; do
              sleep 1
              ELAPSED=$((ELAPSED + 1))
            done
            
            # Check if process exited
            if kill -0 $APP_PID 2>/dev/null; then
              echo "Application did not exit after Ctrl+Q within ${TIMEOUT}s, killing it"
              kill $APP_PID
              wait $APP_PID 2>/dev/null || true
              EXIT_CODE=$?
            else
              wait $APP_PID 2>/dev/null || true
              EXIT_CODE=$?
            fi
          else
            echo "Window not found, application may have crashed or failed to start"
            wait $APP_PID 2>/dev/null || true
            EXIT_CODE=$?
          fi
          
          # Clean up Xvfb
          kill $XVFB_PID 2>/dev/null || true
          
          echo "Application exit code: $EXIT_CODE"
          
          # Exit with 0 if app exited cleanly (0 or 143 for SIGTERM)
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 143 ]; then
            echo "GUI test passed"
            exit 0
          else
            echo "GUI test failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: gui-test-screenshot-${{ github.sha }}
          path: screenshots/
          retention-days: 2

