        .github/scripts/setup-test-credentials.sh

    - name: Run RunUpDetector unit test
      run: /usr/lib/l2trader/tests/test_runupdetector

  run-barcache-test-rpi:
    runs-on: [self-hosted, Linux, ARM64]
