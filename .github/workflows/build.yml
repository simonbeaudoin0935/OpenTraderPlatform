          ccache --zero-stats

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-noble-X86-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-asan-noble-X86-${{ github.ref }}
            ccache-asan-noble-X86-refs/heads/main

      - name: Configure ASan build with CMake
        run: |
          cmake --version
          mkdir -p build/ASan
          cmake -S . -B build/ASan -DCMAKE_BUILD_TYPE=Debug -DENABLE_GUI=ON -DBUILD_TESTS=OFF -DENABLE_ASAN=ON

      - name: Build ASan targets
        run: cmake --build build/ASan -j$(nproc)

      - name: Upload ASan executable artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: l2trader-asan-${{ github.sha }}
          path: |
            build/ASan/Src/L2Trader
            build/ASan/Src/*.so
            build/ASan/lib/
          retention-days: 1

  test-asan:
    runs-on: ubuntu-24.04
    needs: build-asan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    
