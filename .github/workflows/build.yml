name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'laptop'
        type: choice
        options:
        - laptop
        - raspberrypi

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.set-outputs.outputs.arch }}
      qmake_command: ${{ steps.set-outputs.outputs.qmake_command }}
    
    steps:
    - name: Normalize architecture and qmake command
      id: set-outputs
      run: |
        # Default values
        RASPBERRYPI_ARCH="ARM64"
        LAPTOP_ARCH="X64"

        RASPBERRYPI_QMAKE="/home/simon/Qt/6.4.2/gcc_64/bin/qmake"
        LAPTOP_QMAKE="/home/simon/Qt/6.8.3/gcc_64/bin/qmake"

        ARCH=$LAPTOP_ARCH
        QMAKE_COMMAND=$LAPTOP_QMAKE
        
        # Check if triggered by workflow_dispatch
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ "${{ github.event.inputs.target }}" = "raspberrypi" ]; then
            ARCH=$RASPBERRYPI_ARCH
            QMAKE_COMMAND=$RASPBERRYPI_QMAKE
          else
            ARCH=$LAPTOP_ARCH
            QMAKE_COMMAND=$LAPTOP_QMAKE
          fi
        fi
        
        echo "arch=$ARCH" >> $GITHUB_OUTPUT
        echo "qmake_command=$QMAKE_COMMAND" >> $GITHUB_OUTPUT

  build-main:
    needs: setup-environment
    runs-on: [self-hosted, Linux, "${{ needs.setup-environment.outputs.arch }}"]

    steps:
    - uses: actions/checkout@v4

    - name: Set Qt path
      run: |
        echo "QMAKE=${{ needs.setup-environment.outputs.qmake_command }}" >> $GITHUB_ENV
        if [ "${{ needs.setup-environment.outputs.arch }}" = "ARM64" ]; then
          echo "MAKE_JOBS=-j2" >> $GITHUB_ENV
        else
          echo "MAKE_JOBS=-j$(nproc)" >> $GITHUB_ENV
        fi

    - name: Show Qt version
      run: $QMAKE --version
    
    - name: Create build directory
      run: mkdir -p build

    - name: Run qmake
      run: $QMAKE L2Trader.pro -o build/Makefile -spec linux-g++ CONFIG+=debug CONFIG+=qml_debug

    - name: Run make
      run: make $MAKE_JOBS -C build

  build-recorder:
    needs: [build-main, setup-environment]
    runs-on: [self-hosted, Linux, "${{ needs.setup-environment.outputs.arch }}"]

    steps:
    - uses: actions/checkout@v4

    - name: Set Qt path
      run: |
        echo "QMAKE=${{ needs.setup-environment.outputs.qmake_command }}" >> $GITHUB_ENV
        if [ "${{ needs.setup-environment.outputs.arch }}" = "ARM64" ]; then
          echo "MAKE_JOBS=-j2" >> $GITHUB_ENV
        else
          echo "MAKE_JOBS=-j$(nproc)" >> $GITHUB_ENV
        fi

    - name: Create build directory
      run: mkdir -p build

    - name: Run qmake
      run: $QMAKE Recorder.pro -o build/Makefile -spec linux-g++ CONFIG+=debug CONFIG+=qml_debug

    - name: Run make
      run: make $MAKE_JOBS -C build

  build-tests:
    runs-on: [self-hosted, Linux, "${{ needs.setup-environment.outputs.arch }}"]
    needs: [build-recorder, setup-environment]

    steps:
    - uses: actions/checkout@v4

    - name: Set Qt path
      run: |
        echo "QMAKE=${{ needs.setup-environment.outputs.qmake_command }}" >> $GITHUB_ENV
        if [ "${{ needs.setup-environment.outputs.arch }}" = "ARM64" ]; then
          echo "MAKE_JOBS=-j2" >> $GITHUB_ENV
        else
          echo "MAKE_JOBS=-j$(nproc)" >> $GITHUB_ENV
        fi

    - name: Create build directory for tests
      run: mkdir -p build/Tests

    - name: Run qmake for tests
      run: $QMAKE Tests.pro -o build/Tests/Makefile -spec linux-g++ CONFIG+=debug CONFIG+=qml_debug

    - name: Run make for tests
      run: make $MAKE_JOBS -C build/Tests

  run-barcache-test:
    runs-on: [self-hosted, Linux, "${{ needs.setup-environment.outputs.arch }}"]
    needs: [build-tests, setup-environment]

    steps:
    - name: Run BarCache unit test
      run: ./build/Tests/Tests/BarCacheUnit/test_barcache --stock-csv=Example_Config/nasdaq_screener.csv

  run-fmpclient-test:
    #We are going to dump FMP in the future
    if: false
    runs-on: [self-hosted, Linux, "${{ needs.setup-environment.outputs.arch }}"]
    needs: [build-tests, setup-environment]

    steps:
    - name: Run FMPClient unit test
      run: ./build/Tests/Tests/FMPClientUnit/test_fmpclient

  run-tsclient-test:
    runs-on: [self-hosted, Linux, "${{ needs.setup-environment.outputs.arch }}"]
    needs: [build-tests, setup-environment]

    steps:
    - name: Run TSClient unit test
      run: ./build/Tests/Tests/TSClientUnit/test_tradestationclient

  run-runupdetector-test:
    runs-on: [self-hosted, Linux, "${{ needs.setup-environment.outputs.arch }}"]
    needs: [build-tests, setup-environment]

    steps:
    - name: Run RunUpDetector unit test
      run: ./build/Tests/Tests/RunUpDetectorUnit/test_RunUpDetector

  build-debian-package:
    runs-on: [self-hosted, Linux, "${{ needs.setup-environment.outputs.arch }}"]
    needs: setup-environment
    permissions:
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@v4

    - name: Build Debian package
      run: |
        export QMAKE="${{ needs.setup-environment.outputs.qmake_command }}"
        dpkg-buildpackage -us -uc -b

    - name: Prepare artifacts directory
      run: |
        mkdir -p artifacts
        cp ../*.deb artifacts/

    - name: List generated packages
      run: ls -lh artifacts/*.deb

    - name: Upload Debian packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages-${{ needs.setup-environment.outputs.arch }}
        path: artifacts/*.deb