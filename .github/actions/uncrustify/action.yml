name: Run Uncrustify
descrtiption: An action to run Uncrustify on source code files.

runs:
  using: "composite"
  
  steps:
    - name: Run Uncrustify
      shell: bash
      run: |
        echo "Checking code formatting with Uncrustify..."
        FAILED_FILES=()
        
        # Find all C++ source and header files
        FILES=$(find Src Tests -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cxx" \))
        
        for file in $FILES; do
          if ! uncrustify -c .uncrustify.cfg --check "$file" > /dev/null 2>&1; then
            FAILED_FILES+=("$file")
            echo "❌ $file needs formatting"
          fi
        done
        
        if [ ${#FAILED_FILES[@]} -ne 0 ]; then
          echo ""
          echo "================================================"
          echo "Code formatting check FAILED"
          echo "================================================"
          echo ""
          echo "The following files need to be formatted:"
          for file in "${FAILED_FILES[@]}"; do
            echo "  - $file"
          done
          echo ""
          echo "To fix formatting issues, run:"
          echo "  uncrustify -c .uncrustify.cfg --no-backup --replace <file>"
          echo ""
          echo "Or format all files:"
          echo "  find Src Tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -exec uncrustify -c .uncrustify.cfg --no-backup --replace {} \;"
          exit 1
        fi
        
        echo ""
        echo "✅ All files are properly formatted!"
