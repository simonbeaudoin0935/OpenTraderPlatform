# Uncrustify Configuration for L2Trader
# Based on Qt coding conventions and C++17 standards

# General settings
newlines                                 = lf        # Use Unix line endings
input_tab_size                           = 4         # Tabs are 4 spaces wide
output_tab_size                          = 4         # Output tabs as 4 spaces
indent_columns                           = 4         # Indent by 4 spaces
indent_with_tabs                         = 0         # Use spaces, not tabs

# Code alignment
align_var_def_span                       = 0
align_var_def_thresh                     = 0
align_assign_span                        = 0
align_enum_equ_span                      = 0
align_typedef_span                       = 0
align_right_cmt_span                     = 0

# Indentation
indent_brace                             = 0         # Don't indent braces
indent_braces                            = false
indent_braces_no_func                    = false
indent_braces_no_class                   = false
indent_braces_no_struct                  = false
indent_switch_case                       = 4         # Indent case statements
indent_switch_body                       = 0
indent_namespace                         = false     # Don't indent namespace content
indent_extern                            = false
indent_class                             = true
indent_ctor_init_leading                 = 4
indent_ctor_init                         = 4
indent_access_spec                       = -4        # Access specifiers back 4 spaces
indent_paren_nl                          = false
indent_func_call_param                   = true
indent_func_def_param                    = true
indent_func_proto_param                  = true
indent_func_class_param                  = true
indent_func_ctor_var_param               = true
indent_template_param                    = true

# Spacing
sp_before_ptr_star                       = force     # Type* ptr (force space before *)
sp_after_ptr_star                        = remove    # Type* ptr (remove space after *)
sp_between_ptr_star                      = remove
sp_before_unnamed_ptr_star               = ignore
sp_before_ptr_star_func                  = force
sp_before_byref                          = force     # Type& ref
sp_after_byref                           = remove
sp_before_unnamed_byref                  = ignore
sp_after_type                            = force
sp_template_angle                        = remove    # vector<int> not vector <int>
sp_before_angle                          = remove
sp_inside_angle                          = remove
sp_after_angle                           = force
sp_angle_paren                           = remove
sp_angle_word                            = ignore
sp_before_sparen                         = force     # if (condition)
sp_inside_sparen                         = remove    # if (condition) not if ( condition )
sp_after_sparen                          = force     # if (condition) {
sp_sparen_brace                          = force
sp_special_semi                          = ignore
sp_before_semi                           = remove
sp_before_semi_for_empty                 = remove
sp_after_semi                            = add
sp_after_semi_for_empty                  = ignore
sp_after_comma                           = force
sp_before_comma                          = remove
sp_paren_paren                           = remove    # Remove space between nested parens
sp_inside_paren                          = remove
sp_inside_fparen                         = remove    # Function call parens
sp_inside_tparen                         = remove
sp_after_cast                            = remove
sp_inside_braces_enum                    = force
sp_inside_braces_struct                  = force
sp_inside_braces                         = force
sp_inside_braces_empty                   = remove
sp_type_func                             = force
sp_func_proto_paren                      = remove    # void func()
sp_func_def_paren                        = remove    # void func()
sp_inside_fparens                        = remove
sp_func_call_paren                       = remove    # func()
sp_func_call_paren_empty                 = remove
sp_func_class_paren                      = remove
sp_return_paren                          = force     # return (value)
sp_sizeof_paren                          = remove    # sizeof(int)
sp_after_class_colon                     = force
sp_before_class_colon                    = force
sp_before_case_colon                     = remove
sp_after_operator                        = remove
sp_after_operator_sym                    = remove
sp_cond_colon                            = force     # Ternary operator spacing
sp_cond_question                         = force

# Lambda formatting
sp_cpp_lambda_assign                     = ignore   # Space around '=' in lambda capture
sp_cpp_lambda_square_paren               = ignore   # Space after capture spec with paren
sp_cpp_lambda_square_brace               = ignore   # Space after capture spec with brace
sp_cpp_lambda_argument_list_empty        = ignore   # Space in empty lambda argument list
sp_cpp_lambda_argument_list              = ignore   # Space in lambda argument list
sp_cpp_lambda_paren_brace                = ignore   # Space between ) and { in lambda
sp_cpp_lambda_fparen                     = ignore   # Space for immediately invoked lambda
indent_cpp_lambda_body                   = false    # Indent lambda body
nl_cpp_lambda_leave_one_liners           = false    # Don't split one-line lambdas
indent_cpp_lambda_only_once              = false    # Indent only once for nested lambdas

# Brace placement
nl_enum_brace                            = remove    # enum {
nl_struct_brace                          = remove    # struct {
nl_union_brace                           = remove    # union {
nl_if_brace                              = remove    # if () {
nl_brace_else                            = remove    # } else {
nl_elseif_brace                          = remove    # else if () {
nl_else_brace                            = remove    # else {
nl_for_brace                             = remove    # for () {
nl_while_brace                           = remove    # while () {
nl_do_brace                              = remove    # do {
nl_brace_while                           = remove    # } while
nl_switch_brace                          = remove    # switch () {
nl_fcall_brace                           = remove    # func() {
nl_fdef_brace                            = add       # void func()
nl_class_brace                           = add       # class X
nl_constr_colon                          = add       # Newline after colon in constructor init
nl_constr_init_args                      = add       # Newline after each initializer
pos_constr_comma                         = trail     # Comma at end of line in init list
nl_namespace_brace                       = remove    # namespace {
nl_try_brace                             = remove    # try {
nl_catch_brace                           = remove    # } catch {
nl_brace_catch                           = remove    # } catch
nl_brace_finally                         = remove    # } finally

# Newlines
eat_blanks_after_open_brace              = true
eat_blanks_before_close_brace            = true
nl_start_of_file                         = remove
nl_end_of_file                           = force
nl_end_of_file_min                       = 1
nl_max                                   = 2         # Maximum consecutive blank lines
nl_after_func_proto                      = 0
nl_after_func_proto_group                = 0
nl_after_func_body                       = 2
nl_after_func_body_one_liner             = 0
nl_before_block_comment                  = 2
nl_after_struct                          = 0
nl_after_class                           = 0
nl_after_access_spec                     = 1
nl_before_access_spec                    = 1
nl_after_try_catch_finally               = 0

# Positioning
pos_arith                                = trail     # Arithmetic operators at end of line
pos_assign                               = trail
pos_bool                                 = trail
pos_compare                              = trail
pos_conditional                          = trail
pos_comma                                = trail
pos_class_comma                          = trail
pos_class_colon                          = trail

# Line splitting
code_width                               = 120      # Prefer 120 character line width
ls_for_split_full                        = true
ls_func_split_full                       = true

# Blank lines
nl_inside_namespace                      = 0

# Preprocessor
pp_indent                                = add
pp_space_after                           = add       # Add space after #
pp_indent_at_level                       = true

# Comments
cmt_indent_multi                         = true
cmt_star_cont                            = true
cmt_multi_check_last                     = true
cmt_insert_file_header                   = ""
cmt_insert_file_footer                   = ""
cmt_insert_func_header                   = ""
cmt_insert_class_header                  = ""

# Misc
mod_full_brace_if                        = force     # Force braces on if statements
mod_full_brace_for                       = force     # Force braces on for loops
mod_full_brace_do                        = force     # Force braces on do loops
mod_full_brace_while                     = force     # Force braces on while loops
mod_full_brace_if_chain                  = 1
mod_pawn_semicolon                       = false
mod_remove_extra_semicolon               = true
mod_add_long_ifdef_endif_comment         = 0
mod_add_long_ifdef_else_comment          = 0
mod_sort_import                          = false
mod_sort_using                           = false
mod_sort_include                         = false
mod_move_case_break                      = false

# Trailing whitespace
sp_before_nl_cont                        = add
nl_remove_extra_newlines                 = 1
