# Uncrustify Configuration for L2Trader
# Based on Qt coding conventions and C++17 standards

# General settings
newlines                                 = lf        # Use Unix line endings
input_tab_size                           = 4         # Tabs are 4 spaces wide
output_tab_size                          = 4         # Output tabs as 4 spaces
indent_columns                           = 4         # Indent by 4 spaces
indent_with_tabs                         = 0         # Use spaces, not tabs

# Code alignment
align_var_def_span                       = 0         # Number of lines to align variable definitions across
align_var_def_thresh                     = 0         # Minimum column threshold for variable definition alignment
align_assign_span                        = 0         # Number of lines to align assignment operators across
align_enum_equ_span                      = 0         # Number of lines to align enum equals across
align_typedef_span                       = 0         # Number of lines to align typedefs across
align_right_cmt_span                     = 0         # Number of lines to align right comments across

# Indentation
indent_brace                             = 0         # Don't indent braces
indent_braces                            = false     # Don't indent braces relative to the parent
indent_braces_no_func                    = false     # Don't indent braces for functions
indent_braces_no_class                   = false     # Don't indent braces for classes
indent_braces_no_struct                  = false     # Don't indent braces for structs
indent_switch_case                       = 4         # Indent case statements
indent_switch_body                       = 0         # Don't indent switch body
indent_namespace                         = false     # Don't indent namespace content
indent_extern                            = false     # Don't indent extern blocks
indent_class                             = true      # Indent class contents
indent_ctor_init_leading                 = 4         # Indent constructor initializer leading
indent_ctor_init                         = 4         # Indent constructor initializer
indent_access_spec                       = -4        # Access specifiers back 4 spaces
indent_paren_nl                          = false     # Don't indent after newline in parentheses
indent_func_call_param                   = true      # Indent function call parameters
indent_func_def_param                    = true      # Indent function definition parameters
indent_func_proto_param                  = true      # Indent function prototype parameters
indent_func_class_param                  = true      # Indent function class parameters
indent_func_ctor_var_param               = true      # Indent function constructor variable parameters
indent_template_param                    = true      # Indent template parameters

# Spacing
sp_before_ptr_star                       = force     # Force space before pointer star: Type* ptr
sp_after_ptr_star                        = remove    # Remove space after pointer star: Type* ptr
sp_between_ptr_star                      = remove    # Remove space between multiple pointer stars
sp_before_unnamed_ptr_star               = ignore    # Ignore space before unnamed pointer star
sp_before_ptr_star_func                  = force     # Force space before pointer star in function
sp_before_byref                          = force     # Force space before reference: Type& ref
sp_after_byref                           = remove    # Remove space after reference: Type& ref
sp_before_unnamed_byref                  = ignore    # Ignore space before unnamed reference
sp_after_type                            = force     # Force space after type: int x
sp_template_angle                        = remove    # Remove space in template angles: vector<int>
sp_before_angle                          = remove    # Remove space before template angle
sp_inside_angle                          = remove    # Remove space inside template angles
sp_after_angle                           = force     # Force space after template angle
sp_angle_paren                           = remove    # Remove space between angle and paren
sp_angle_word                            = ignore    # Ignore space between angle and word
sp_before_sparen                         = force     # Force space before statement paren: if (
sp_inside_sparen                         = remove    # Remove space inside statement paren: if (condition)
sp_after_sparen                          = force     # Force space after statement paren: if () {
sp_sparen_brace                          = force     # Force space between statement paren and brace
sp_special_semi                          = ignore    # Ignore space before special semicolon
sp_before_semi                           = remove    # Remove space before semicolon
sp_before_semi_for_empty                 = remove    # Remove space before semicolon in empty statement
sp_after_semi                            = add       # Add space after semicolon
sp_after_semi_for_empty                  = ignore    # Ignore space after semicolon in empty statement
sp_after_comma                           = force     # Force space after comma
sp_before_comma                          = remove    # Remove space before comma
sp_paren_paren                           = remove    # Remove space between nested parens
sp_inside_paren                          = remove    # Remove space inside parens
sp_inside_fparen                         = remove    # Remove space inside function parens
sp_inside_tparen                         = remove    # Remove space inside template parens
sp_after_cast                            = remove    # Remove space after cast: (int)x
sp_inside_braces_enum                    = force     # Force space inside enum braces
sp_inside_braces_struct                  = force     # Force space inside struct braces
sp_inside_braces                         = force     # Force space inside braces
sp_inside_braces_empty                   = remove    # Remove space inside empty braces
sp_type_func                             = force     # Force space between type and function
sp_func_proto_paren                      = remove    # Remove space in function prototype paren: void func()
sp_func_def_paren                        = remove    # Remove space in function definition paren
sp_inside_fparens                        = remove    # Remove space inside function parens
sp_func_call_paren                       = remove    # Remove space in function call paren: func()
sp_func_call_paren_empty                 = remove    # Remove space in empty function call paren
sp_func_class_paren                      = remove    # Remove space in function class paren
sp_return_paren                          = force     # Force space in return paren: return (value)
sp_sizeof_paren                          = remove    # Remove space in sizeof paren: sizeof(int)
sp_after_class_colon                     = force     # Force space after class colon
sp_before_class_colon                    = force     # Force space before class colon
sp_before_case_colon                     = remove    # Remove space before case colon
sp_after_operator                        = remove    # Remove space after operator
sp_after_operator_sym                    = remove    # Remove space after operator symbol
sp_cond_colon                            = force     # Force space around ternary colon
sp_cond_question                         = force     # Force space around ternary question

# Lambda formatting
sp_cpp_lambda_assign                     = true     # Add space around '=' in lambda capture lists (e.g., [=] or [&x = y])
sp_cpp_lambda_square_paren               = false    # Control space after lambda capture spec when followed by parentheses
sp_cpp_lambda_square_brace               = false    # Control space after lambda capture spec when followed by braces
sp_cpp_lambda_argument_list_empty        = false    # Control space inside empty lambda argument lists (e.g., []())
sp_cpp_lambda_argument_list              = ignore   # Control space inside lambda argument lists (e.g., [](int x))
sp_cpp_lambda_paren_brace                = remove   # Remove space between lambda parameter list and body (e.g., [](){} not []() {})
sp_cpp_lambda_fparen                     = add      # Control space for immediately invoked lambdas (e.g., [](){}())
indent_cpp_lambda_body                   = true     # Indent the contents of lambda bodies
nl_cpp_lambda_leave_one_liners           = false    # Do not split one-line lambdas onto multiple lines
indent_cpp_lambda_only_once              = false    # Indent nested lambdas only once, not cumulatively

# Brace placement
nl_enum_brace                            = remove    # Remove newline before enum brace: enum {
nl_struct_brace                          = remove    # Remove newline before struct brace: struct {
nl_union_brace                           = remove    # Remove newline before union brace: union {
nl_if_brace                              = remove    # Remove newline before if brace: if () {
nl_brace_else                            = remove    # Remove newline before else: } else {
nl_elseif_brace                          = remove    # Remove newline before else if: else if () {
nl_else_brace                            = remove    # Remove newline before else brace: else {
nl_for_brace                             = remove    # Remove newline before for brace: for () {
nl_while_brace                           = remove    # Remove newline before while brace: while () {
nl_do_brace                              = remove    # Remove newline before do brace: do {
nl_brace_while                           = remove    # Remove newline before while in do-while: } while
nl_switch_brace                          = remove    # Remove newline before switch brace: switch () {
nl_fcall_brace                           = remove    # Remove newline before function call brace: func() {
nl_fdef_brace                            = add       # Add newline before function definition brace
nl_class_brace                           = add       # Add newline before class brace
nl_constr_colon                          = add       # Add newline after colon in constructor init
nl_constr_init_args                      = add       # Add newline after each initializer
pos_constr_comma                         = trail     # Place comma at end of line in init list
nl_func_call_args                        = add       # Add newline after each comma in function call
nl_namespace_brace                       = remove    # Remove newline before namespace brace: namespace {
nl_try_brace                             = remove    # Remove newline before try brace: try {
nl_catch_brace                           = remove    # Remove newline before catch: } catch {
nl_brace_catch                           = remove    # Remove newline before catch
nl_brace_finally                         = remove    # Remove newline before finally
nl_brace_fparen                          = force     # Force newline between ) and {

# Newlines
eat_blanks_after_open_brace              = true      # Remove blank lines after open brace
eat_blanks_before_close_brace            = true      # Remove blank lines before close brace
nl_start_of_file                         = remove    # Remove newline at start of file
nl_end_of_file                           = force     # Force newline at end of file
nl_end_of_file_min                       = 1         # Minimum newlines at end of file
nl_max                                   = 2         # Maximum consecutive blank lines
nl_after_func_proto                      = 0         # Newlines after function prototype
nl_after_func_proto_group                = 0         # Newlines after function prototype group
nl_after_func_body                       = 2         # Newlines after function body
nl_after_func_body_one_liner             = 0         # Newlines after one-liner function body
nl_before_block_comment                  = 2         # Newlines before block comment
nl_after_struct                          = 0         # Newlines after struct
nl_after_class                           = 0         # Newlines after class
nl_after_access_spec                     = 1         # Newlines after access specifier
nl_before_access_spec                    = 1         # Newlines before access specifier
nl_after_try_catch_finally               = 0         # Newlines after try/catch/finally

# Positioning
pos_arith                                = trail     # Place arithmetic operators at end of line
pos_assign                               = trail     # Place assignment operators at end of line
pos_bool                                 = trail     # Place boolean operators at end of line
pos_compare                              = trail     # Place comparison operators at end of line
pos_conditional                          = trail     # Place conditional operators at end of line
pos_comma                                = trail     # Place commas at end of line
pos_class_comma                          = trail     # Place class commas at end of line
pos_class_colon                          = trail     # Place class colons at end of line

# Line splitting
code_width                               = 120      # Prefer 120 character line width
ls_for_split_full                        = true     # Split full for loops
ls_func_split_full                       = true     # Split full function calls

# Blank lines
nl_inside_namespace                      = 0         # No blank lines inside namespace

# Preprocessor
pp_indent                                = add       # Add indentation to preprocessor directives
pp_space_after                           = add       # Add space after # in preprocessor
pp_indent_at_level                       = true      # Indent preprocessor at current level

# Comments
cmt_indent_multi                         = true     # Indent multiline comments
cmt_star_cont                            = true     # Continue star in multiline comments
cmt_multi_check_last                     = true     # Check last line of multiline comments
cmt_insert_file_header                   = ""        # Insert file header comment
cmt_insert_file_footer                   = ""        # Insert file footer comment
cmt_insert_func_header                   = ""        # Insert function header comment
cmt_insert_class_header                  = ""        # Insert class header comment

# Misc
mod_full_brace_if                        = force     # Force braces on if statements
mod_full_brace_for                       = force     # Force braces on for loops
mod_full_brace_do                        = force     # Force braces on do loops
mod_full_brace_while                     = force     # Force braces on while loops
mod_full_brace_if_chain                  = 1         # Force braces on if chains
mod_pawn_semicolon                       = false     # Don't modify pawn semicolons
mod_remove_extra_semicolon               = true      # Remove extra semicolons
mod_add_long_ifdef_endif_comment         = 0         # Don't add long ifdef endif comments
mod_add_long_ifdef_else_comment          = 0         # Don't add long ifdef else comments
mod_sort_import                          = false     # Don't sort imports
mod_sort_using                           = false     # Don't sort using statements
mod_sort_include                         = false     # Don't sort includes
mod_move_case_break                      = false     # Don't move case break

# Trailing whitespace
sp_before_nl_cont                        = add       # Add space before newline continuation
nl_remove_extra_newlines                 = 1         # Remove extra newlines
